<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E293B">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <title>{% block title %}Expense Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>
    // Shared utilities - defined early so all modules can use them
    window.EtUtils = window.EtUtils || {};
    window.EtUtils.$ = (sel) => document.querySelector(sel);
    window.EtUtils.$$ = (sel) => document.querySelectorAll(sel);
    window.EtUtils.money = (n) => Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    window.EtUtils.isGuest = {{ 'true' if is_guest else 'false' }};
    window.EtUtils.apiBase = window.EtUtils.isGuest ? "/api/guest" : "/api";
    window.EtUtils.escapeHtml = (str) => {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    };
  </script>
</head>

<body data-currency="{{ base_currency }}" data-guest="{{ 'true' if is_guest else 'false' }}">
  {% block content %}{% endblock %}

  {% block scripts %}{% endblock %}
  <script>
    var swPath = "{{ url_for('static', filename='sw.js') }}";
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register(swPath).catch(function() {});
      });
    }
  </script>
</body>

</html>
